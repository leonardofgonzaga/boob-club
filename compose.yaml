
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bookclub-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      XDEBUG_MODE: debug
      XDEBUG_CONFIG: client_host=host.docker.internal
    ports:
      - "8000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bookclub-network

  node:
    image: node:22-alpine
    container_name: bookclub-node
    working_dir: /var/www/html
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    networks:
      - bookclub-network

  mysql:
    image: mysql:8.4
    container_name: bookclub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookclub
      MYSQL_USER: bookclub
      MYSQL_PASSWORD: bookclub123
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bookclub-network

volumes:
  mysql_data:
  node_modules:

networks:
  bookclub-network:
    driver: bridge
